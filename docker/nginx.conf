# Serves the static wallet website built by `pnpm build:website`:
#   /            Next.js static export of packages/docs (trailingSlash: true)
#   /app/        Vite build of packages/app (HashRouter, no deep routes)
#   /storybook/  Storybook static build of packages/app
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Hashed build assets never change: cache for a year.
    location ~ ^/(_next/static|app/assets|storybook/assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        # Vercel `trailingSlash: true`: canonicalise /docs/install -> /docs/install/
        set $add_slash 0;
        if (-d $request_filename) {
            set $add_slash 1;
        }
        if ($uri ~ /$) {
            set $add_slash 0;
        }
        if ($add_slash = 1) {
            return 308 $uri/$is_args$args;
        }
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
