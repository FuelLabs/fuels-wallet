name: Deploy to Railway

# Deploys the wallet website (wallet.fuel.network) to the `fuels-wallet` service
# of the Railway project `fuel-web`. Needs the RAILWAY_TOKEN repository secret
# (a project token for fuel-web); the job skips itself while it is missing.
on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: railway-fuels-wallet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check secret
        id: gate
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "RAILWAY_TOKEN not set; skipping"; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: Install Railway CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @railway/cli@4
      - name: railway up
        if: steps.gate.outputs.run == 'true'
        run: railway up --ci --service fuels-wallet
